<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Money Tracker · Level-up</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#5b8def" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="icons/icon-192.png" alt="" width="46" height="46" />
        <div>
          <h1>Money Tracker</h1>
          <p class="tagline">Building your dreams by acting</p>
        </div>
      </div>
      <div class="top-actions">
        <div id="account" class="account"></div>
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Sync status / sign-in banner -->
    <div id="syncBanner" class="sync-banner" hidden></div>

    <!-- Summary cards -->
    <section class="cards">
      <div class="card balance">
        <span class="card-label">Balance</span>
        <span class="card-value money" id="balanceVal">$0.00</span>
      </div>
      <div class="card income">
        <span class="card-label">Income</span>
        <span class="card-value money" id="incomeVal">$0.00</span>
      </div>
      <div class="card expense">
        <span class="card-label">Expenses</span>
        <span class="card-value money" id="expenseVal">$0.00</span>
      </div>
    </section>

    <div class="main-grid">
      <!-- Add transaction -->
      <section class="panel">
        <h2>Add transaction</h2>
        <form id="txForm" class="tx-form" autocomplete="off">
          <div class="toggle">
            <input type="radio" name="type" id="typeExpense" value="expense" checked />
            <label for="typeExpense" class="toggle-btn expense-toggle">Expense</label>
            <input type="radio" name="type" id="typeIncome" value="income" />
            <label for="typeIncome" class="toggle-btn income-toggle">Income</label>
          </div>

          <label class="field">
            <span>Description</span>
            <input type="text" id="desc" placeholder="e.g. Groceries" required maxlength="60" />
          </label>

          <div class="field-row">
            <label class="field">
              <span>Amount</span>
              <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required inputmode="decimal" />
            </label>
            <label class="field">
              <span>Category</span>
              <select id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Housing</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Health</option>
                <option>Entertainment</option>
                <option>Salary</option>
                <option>Other</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>Date</span>
            <input type="date" id="date" required />
          </label>

          <button type="submit" class="submit-btn">Add transaction</button>
        </form>
      </section>

      <!-- Transaction list -->
      <section class="panel">
        <div class="panel-head">
          <h2>History</h2>
          <select id="filter" class="filter">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
          </select>
        </div>
        <ul id="txList" class="tx-list"></ul>
        <p id="emptyState" class="empty">No transactions yet. Add your first one!</p>
      </section>
    </div>

    <!-- Category breakdown -->
    <section class="panel breakdown">
      <h2>Spending by category</h2>
      <div id="breakdown" class="breakdown-list"></div>
      <p id="breakdownEmpty" class="empty">Add some expenses to see your breakdown.</p>
    </section>

    <footer class="footer">
      <span id="footerNote">Data is saved on this device.</span>
      <button id="clearAll" class="link-btn">Clear all data</button>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
