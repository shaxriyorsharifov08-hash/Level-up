<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --text: #1a1f36;
    --muted: #6b7280;
    --border: #e5e8f0;
    --accent: #5b8def;
    --income: #16a34a;
    --income-soft: #dcfce7;
    --expense: #dc2626;
    --expense-soft: #fee2e2;
    --shadow: 0 2px 12px rgba(20, 30, 60, 0.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --panel: #1a2033; --text: #e8ecf5; --muted: #94a0b8;
      --border: #2a3247; --income: #4ade80; --income-soft: #14321f;
      --expense: #f87171; --expense-soft: #3a1a1a; --shadow: 0 2px 16px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb; --panel: #ffffff; --text: #1a1f36; --muted: #6b7280;
    --border: #e5e8f0; --income: #16a34a; --income-soft: #dcfce7;
    --expense: #dc2626; --expense-soft: #fee2e2; --shadow: 0 2px 12px rgba(20,30,60,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #0f1420; --panel: #1a2033; --text: #e8ecf5; --muted: #94a0b8;
    --border: #2a3247; --income: #4ade80; --income-soft: #14321f;
    --expense: #f87171; --expense-soft: #3a1a1a; --shadow: 0 2px 16px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .money { font-variant-numeric: tabular-nums; }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; display: grid; place-items: center;
    font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    color: #fff; border-radius: 12px;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; }
  .tagline { font-size: 13px; color: var(--muted); }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--border);
    width: 42px; height: 42px; border-radius: 10px; color: var(--text);
    font-size: 18px; cursor: pointer; transition: transform 0.1s;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
  }
  .card-label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .card-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .card.income .card-value { color: var(--income); }
  .card.expense .card-value { color: var(--expense); }
  .card.balance { border-left: 4px solid var(--accent); }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 16px; margin-bottom: 16px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; }
  .panel-head h2 { margin-bottom: 0; }

  .tx-form { display: flex; flex-direction: column; gap: 14px; }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 10px; padding: 4px; gap: 4px; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle-btn {
    text-align: center; padding: 9px; border-radius: 8px; font-weight: 600; font-size: 14px;
    cursor: pointer; color: var(--muted); transition: all 0.15s;
  }
  #typeExpense:checked + .expense-toggle { background: var(--expense-soft); color: var(--expense); }
  #typeIncome:checked + .income-toggle { background: var(--income-soft); color: var(--income); }
  .toggle input:focus-visible + .toggle-btn { outline: 2px solid var(--accent); outline-offset: 2px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select {
    font-family: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .submit-btn {
    margin-top: 4px; background: var(--accent); color: #fff; border: none;
    padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: filter 0.15s, transform 0.1s;
  }
  .submit-btn:hover { filter: brightness(1.05); }
  .submit-btn:active { transform: scale(0.98); }
  .filter { width: auto; padding: 6px 10px; font-size: 13px; }

  .tx-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .tx-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
  .tx-icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .tx-icon.income { background: var(--income-soft); }
  .tx-icon.expense { background: var(--expense-soft); }
  .tx-info { flex: 1; min-width: 0; }
  .tx-desc { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 12px; color: var(--muted); }
  .tx-amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .tx-amount.income { color: var(--income); }
  .tx-amount.expense { color: var(--expense); }
  .tx-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 18px; padding: 4px 6px; border-radius: 6px; opacity: 0.5;
    transition: opacity 0.15s, color 0.15s;
  }
  .tx-item:hover .tx-del { opacity: 1; }
  .tx-del:hover { color: var(--expense); }
  .tx-del:focus-visible { opacity: 1; outline: 2px solid var(--accent); }

  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

  .breakdown-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .bd-row { display: flex; flex-direction: column; gap: 5px; }
  .bd-top { display: flex; justify-content: space-between; font-size: 14px; }
  .bd-cat { font-weight: 600; }
  .bd-amt { color: var(--muted); }
  .bd-bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bd-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), #7c5cff); }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--expense); cursor: pointer; font-size: 13px; text-decoration: underline; }

  @media (max-width: 680px) {
    .cards { grid-template-columns: 1fr; }
    .main-grid { grid-template-columns: 1fr; }
    .card-value { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">₿</span>
      <div>
        <h1>Money Tracker</h1>
        <p class="tagline">Building your dreams by acting</p>
      </div>
    </div>
    <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  </header>

  <section class="cards">
    <div class="card balance">
      <span class="card-label">Balance</span>
      <span class="card-value money" id="balanceVal">$0.00</span>
    </div>
    <div class="card income">
      <span class="card-label">Income</span>
      <span class="card-value money" id="incomeVal">$0.00</span>
    </div>
    <div class="card expense">
      <span class="card-label">Expenses</span>
      <span class="card-value money" id="expenseVal">$0.00</span>
    </div>
  </section>

  <div class="main-grid">
    <section class="panel">
      <h2>Add transaction</h2>
      <form id="txForm" class="tx-form" autocomplete="off">
        <div class="toggle">
          <input type="radio" name="type" id="typeExpense" value="expense" checked />
          <label for="typeExpense" class="toggle-btn expense-toggle">Expense</label>
          <input type="radio" name="type" id="typeIncome" value="income" />
          <label for="typeIncome" class="toggle-btn income-toggle">Income</label>
        </div>
        <label class="field">
          <span>Description</span>
          <input type="text" id="desc" placeholder="e.g. Groceries" required maxlength="60" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Amount</span>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required />
          </label>
          <label class="field">
            <span>Category</span>
            <select id="category">
              <option>Food</option><option>Transport</option><option>Housing</option>
              <option>Shopping</option><option>Bills</option><option>Health</option>
              <option>Entertainment</option><option>Salary</option><option>Other</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Date</span>
          <input type="date" id="date" required />
        </label>
        <button type="submit" class="submit-btn">Add transaction</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>History</h2>
        <select id="filter" class="filter">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
      </div>
      <ul id="txList" class="tx-list"></ul>
      <p id="emptyState" class="empty">No transactions yet. Add your first one!</p>
    </section>
  </div>

  <section class="panel breakdown">
    <h2>Spending by category</h2>
    <div id="breakdown" class="breakdown-list"></div>
    <p id="breakdownEmpty" class="empty">Add some expenses to see your breakdown.</p>
  </section>

  <footer class="footer">
    <span>Data is saved locally in your browser.</span>
    <button id="clearAll" class="link-btn">Clear all data</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = 'levelup.transactions';
  const THEME_KEY = 'levelup.theme';
  const CATEGORY_ICONS = {
    Food: '🍔', Transport: '🚗', Housing: '🏠', Shopping: '🛍️', Bills: '💡',
    Health: '🏥', Entertainment: '🎬', Salary: '💰', Other: '📦',
  };
  let transactions = load();
  let currentFilter = 'all';
  const $ = (id) => document.getElementById(id);
  const form = $('txForm');
  const txList = $('txList');

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); } catch {} }

  const fmt = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function render() { renderSummary(); renderList(); renderBreakdown(); }
  function renderSummary() {
    const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    $('incomeVal').textContent = fmt(income);
    $('expenseVal').textContent = fmt(expense);
    $('balanceVal').textContent = fmt(income - expense);
  }
  function renderList() {
    const items = transactions
      .filter(t => currentFilter === 'all' || t.type === currentFilter)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    txList.innerHTML = '';
    $('emptyState').style.display = items.length ? 'none' : 'block';
    for (const t of items) {
      const li = document.createElement('li');
      li.className = 'tx-item';
      li.innerHTML =
        '<div class="tx-icon ' + t.type + '">' + (CATEGORY_ICONS[t.category] || '📦') + '</div>' +
        '<div class="tx-info"><div class="tx-desc"></div>' +
        '<div class="tx-meta">' + t.category + ' · ' + formatDate(t.date) + '</div></div>' +
        '<div class="tx-amount money ' + t.type + '">' + (t.type === 'income' ? '+' : '−') + fmt(t.amount) + '</div>' +
        '<button class="tx-del" title="Delete" aria-label="Delete">×</button>';
      li.querySelector('.tx-desc').textContent = t.desc;
      li.querySelector('.tx-del').addEventListener('click', () => remove(t.id));
      txList.appendChild(li);
    }
  }
  function renderBreakdown() {
    const byCat = {};
    for (const t of transactions) {
      if (t.type !== 'expense') continue;
      byCat[t.category] = (byCat[t.category] || 0) + t.amount;
    }
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [, v]) => s + v, 0);
    const container = $('breakdown');
    container.innerHTML = '';
    $('breakdownEmpty').style.display = entries.length ? 'none' : 'block';
    for (const [cat, amt] of entries) {
      const pct = total ? (amt / total) * 100 : 0;
      const row = document.createElement('div');
      row.className = 'bd-row';
      row.innerHTML =
        '<div class="bd-top"><span class="bd-cat">' + (CATEGORY_ICONS[cat] || '📦') + ' ' + cat + '</span>' +
        '<span class="bd-amt money">' + fmt(amt) + ' · ' + pct.toFixed(0) + '%</span></div>' +
        '<div class="bd-bar"><div class="bd-fill" style="width:' + pct + '%"></div></div>';
      container.appendChild(row);
    }
  }

  function add(tx) { transactions.push(tx); save(); render(); }
  function remove(id) { transactions = transactions.filter(t => t.id !== id); save(); render(); }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = parseFloat($('amount').value);
    if (!(amount > 0)) return;
    add({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type: form.type.value,
      desc: $('desc').value.trim() || 'Untitled',
      amount, category: $('category').value, date: $('date').value,
    });
    form.reset();
    $('typeExpense').checked = true;
    $('date').value = today();
    $('desc').focus();
  });
  $('filter').addEventListener('change', (e) => { currentFilter = e.target.value; renderList(); });
  $('clearAll').addEventListener('click', () => {
    if (!transactions.length) return;
    if (confirm('Delete ALL transactions? This cannot be undone.')) {
      transactions = []; save(); render();
    }
  });

  const themeToggle = $('themeToggle');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }
  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  function today() { return new Date().toISOString().slice(0, 10); }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch {}
  applyTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('date').value = today();
  render();
</script>
