name: Tests

# Runs on every push and pull request. You never have to run anything yourself:
# edit index.html on github.com or in github.dev, commit, and this tells you
# within a couple of minutes whether you broke something.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install test dependencies
        run: npm ci || npm install

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the test suite
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
